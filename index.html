<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análisis de Fatiga</title>
<style>
:root{
  --bg:#f2f2f2;
  --panel:#ffffff;
  --ink:#202020;
  --muted:#666666;
  --line:#cfcfcf;
  --accent:#2f5d8a;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--ink);
}
.container{
  max-width:1100px;
  margin:0 auto;
  padding:24px 18px 42px;
}
header{
  border-bottom:2px solid #3d3d3d;
  padding-bottom:12px;
  margin-bottom:22px;
}
h1{
  margin:0;
  font-size:2rem;
  font-weight:700;
  letter-spacing:.1px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  padding:20px;
}
.card h2{
  margin:0 0 18px;
  font-size:1.05rem;
  font-weight:700;
  border-bottom:1px solid var(--line);
  padding-bottom:8px;
}
.help{
  margin:-8px 0 14px;
  color:var(--muted);
  font-size:.9rem;
}
.fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px 16px;
}
.field label{
  display:block;
  font-size:.9rem;
  font-weight:600;
  margin-bottom:5px;
}
.input-wrap{
  display:flex;
  align-items:center;
  border:1px solid #bdbdbd;
  background:#fff;
}
.input-wrap:focus-within{
  border-color:var(--accent);
}
.input-wrap input{
  width:100%;
  border:0;
  outline:0;
  padding:10px 11px;
  font-size:1rem;
  color:var(--ink);
  background:#fff;
}
.unit{
  padding:0 10px;
  color:#555;
  font-size:.85rem;
  border-left:1px solid #d7d7d7;
}
button{
  border:1px solid #26496b;
  padding:10px 16px;
  font-size:.95rem;
  font-weight:600;
  cursor:pointer;
  background:var(--accent);
  color:white;
}
button:hover{background:#254d73}
.secondary{
  background:#eeeeee;
  color:#222;
  border-color:#bdbdbd;
}
.secondary:hover{background:#dfdfdf}
.actions{
  margin-top:16px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.computed{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0;
  margin-top:18px;
  border:1px solid var(--line);
}
.metric{
  padding:12px 14px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:#fafafa;
}
.metric:nth-child(2n){border-right:0}
.metric:nth-last-child(-n+2){border-bottom:0}
.metric .label{
  color:#555;
  font-size:.82rem;
}
.metric .value{
  font-size:1.2rem;
  font-weight:700;
  margin-top:4px;
}
.results{
  width:100%;
  border-collapse:collapse;
  margin-top:4px;
}
.results th,
.results td{
  padding:10px 8px;
  border-bottom:1px solid #dddddd;
  text-align:left;
}
.results th:last-child,
.results td:last-child{text-align:right}
.results th{
  font-size:.82rem;
  color:#555;
  font-weight:700;
  background:#f5f5f5;
}
.results td:last-child{font-weight:700}
.full{grid-column:1/-1}
.chart-wrap{
  width:100%;
  overflow-x:auto;
  border:1px solid var(--line);
  background:#fff;
  padding:8px;
}
svg{
  display:block;
  width:100%;
  min-width:650px;
  height:auto;
}
.legend{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  margin-top:12px;
  font-size:.82rem;
  color:#444;
}
.legend span{
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.dot{
  width:18px;
  height:3px;
  display:inline-block;
}
.error{
  color:#a61b1b;
  margin-top:10px;
  font-size:.9rem;
  min-height:1.2em;
}
@media(max-width:820px){
  .grid{grid-template-columns:1fr}
}
@media(max-width:520px){
  .fields,.computed{grid-template-columns:1fr}
  .metric{
    border-right:0;
    border-bottom:1px solid var(--line)!important;
  }
  .metric:last-child{border-bottom:0!important}
  .container{padding:16px 10px 30px}
  .card{padding:15px}
  h1{font-size:1.6rem}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Análisis de Fatiga</h1>
    
  </header>

  <main class="grid">
    <section class="card">
      <h2>Datos</h2>
      

      <div class="fields">
        <div class="field">
          <label for="smax">σmax — Esfuerzo máximo</label>
          <div class="input-wrap"><input id="smax" type="number" step="any" value="80"><span class="unit">MPa</span></div>
        </div>
        <div class="field">
          <label for="smin">σmin — Esfuerzo mínimo</label>
          <div class="input-wrap"><input id="smin" type="number" step="any" value="20"><span class="unit">MPa</span></div>
        </div>
        <div class="field">
          <label for="sy">Sy — Límite de fluencia</label>
          <div class="input-wrap"><input id="sy" type="number" step="any" value="200"><span class="unit">MPa</span></div>
        </div>
        <div class="field">
          <label for="su">Su — Resistencia última</label>
          <div class="input-wrap"><input id="su" type="number" step="any" value="300"><span class="unit">MPa</span></div>
        </div>
        <div class="field full">
          <label for="nd">nd — Factor de diseño para lugares geométricos</label>
          <div class="input-wrap"><input id="nd" type="number" step="any" value="2"></div>
        </div>
      </div>

      <div class="actions">
        <button id="calc" type="button">Calcular</button>
        <button id="reset" type="button" class="secondary">Restablecer</button>
      </div>
      <div id="error" class="error" aria-live="polite"></div>

      <div class="computed">
        <div class="metric"><div class="label">σa</div><div class="value" id="sa">—</div></div>
        <div class="metric"><div class="label">σm</div><div class="value" id="sm">—</div></div>
        <div class="metric"><div class="label">Se = 0.5 Su</div><div class="value" id="se">—</div></div>
        <div class="metric"><div class="label">Se′ = 0.5 Su</div><div class="value" id="sep">—</div></div>
      </div>
    </section>

    <section class="card">
      <h2>Factores de seguridad</h2>
      
      <table class="results">
        <thead><tr><th>Criterio</th><th>n</th></tr></thead>
        <tbody>
          <tr><td>Soderberg</td><td id="nSod">—</td></tr>
          <tr><td>Goodman Mod</td><td id="nGood">—</td></tr>
          <tr><td>Gerber</td><td id="nGer">—</td></tr>
          <tr><td>ASME Elíptica</td><td id="nAsme">—</td></tr>
          <tr><td>Recta de Langer — Fluencia</td><td id="nLang">—</td></tr>
        </tbody>
      </table>
      
    </section>

    <section class="card full">
      <h2>Diagrama de Fatiga</h2>
      <p class="help">Diagrama σm–σa</p>
      <div class="chart-wrap">
        <svg id="chart" viewBox="0 0 820 480" role="img" aria-label="Diagrama de Fatiga de fatiga"></svg>
      </div>
      <div class="legend" id="legend"></div>
      
    </section>
  </main>
</div>

<script>
(() => {
  const ids = ["smax","smin","sy","su","nd"];
  const $ = id => document.getElementById(id);
  const fmt = v => Number.isFinite(v) ? v.toFixed(3) : "No definido";

  const seriesMeta = [
    ["Soderberg", "#2563eb"],
    ["Goodman Mod", "#0f766e"],
    ["Gerber", "#7c3aed"],
    ["ASME Elíptica", "#dc2626"],
    ["Recta de Langer", "#d97706"],
    ["Línea de carga", "#334155"]
  ];

  function getInputs(){
    const out = {};
    ids.forEach(id => out[id] = Number($(id).value));
    return out;
  }

  function validate(v){
    if(Object.values(v).some(x => !Number.isFinite(x))) return "Todos los campos deben contener números.";
    if(v.sy <= 0 || v.su <= 0 || v.nd <= 0) return "Sy, Su y nd deben ser mayores que cero.";
    return "";
  }

  function safeDiv(a,b){
    return Math.abs(b) < 1e-12 ? NaN : a/b;
  }

  function calculate(){
    const v = getInputs();
    const err = validate(v);
    $("error").textContent = err;
    if(err) return;

    const sa = Math.abs((v.smax - v.smin)/2);
    const sm = (v.smax + v.smin)/2;
    const se = 0.5*v.su;
    const sep = 0.5*v.su;

    $("sa").textContent = fmt(sa) + " MPa";
    $("sm").textContent = fmt(sm) + " MPa";
    $("se").textContent = fmt(se) + " MPa";
    $("sep").textContent = fmt(sep) + " MPa";

    const nSod = safeDiv(1, safeDiv(sa,sep) + safeDiv(sm,v.sy));
    const nGood = safeDiv(1, safeDiv(sa,sep) + safeDiv(sm,v.su));

    let nGer = NaN;
    if(Math.abs(sm) > 1e-12 && Math.abs(sa) > 1e-12 && sep !== 0){
      nGer = 0.5*Math.pow(v.su/sm,2)*(sa/sep)*
        (-1 + Math.sqrt(1 + Math.pow((2*sm*sep)/(v.su*sa),2)));
    } else if (Math.abs(sm) <= 1e-12 && Math.abs(sa) > 1e-12) {
      nGer = sep/sa;
    }

    const nAsme = Math.sqrt(safeDiv(1,
      Math.pow(safeDiv(sa,se),2) + Math.pow(safeDiv(sm,v.sy),2)
    ));
    const nLang = safeDiv(v.sy, sa + sm);

    $("nSod").textContent = fmt(nSod);
    $("nGood").textContent = fmt(nGood);
    $("nGer").textContent = fmt(nGer);
    $("nAsme").textContent = fmt(nAsme);
    $("nLang").textContent = fmt(nLang);

    renderChart({ ...v, sa, sm, se, sep });
  }

  function renderChart(p){
    const svg = $("chart");
    const W=820,H=480,L=70,R=22,T=24,B=58;
    const plotW=W-L-R, plotH=H-T-B;

    // Natural positive-domain intercepts of the equations.
    const xSy = p.sy / p.nd;
    const xSu = p.su / p.nd;
    const xmax = Math.max(xSy, xSu) * 1.08;

    const functions = [
      {
        name:"Soderberg", color:seriesMeta[0][1], xmax:xSy,
        fn:x => p.sep * (1/p.nd - x/p.sy)
      },
      {
        name:"Goodman Mod", color:seriesMeta[1][1], xmax:xSu,
        fn:x => p.sep * (1/p.nd - x/p.su)
      },
      {
        name:"Gerber", color:seriesMeta[2][1], xmax:xSu,
        fn:x => (p.sep/p.nd) * (1 - Math.pow((p.nd*x)/p.su,2))
      },
      {
        name:"ASME Elíptica", color:seriesMeta[3][1], xmax:xSy,
        fn:x => {
          const inside = 1 - Math.pow((p.nd*x)/p.sy,2);
          return inside < 0 ? NaN : (p.sep/p.nd)*Math.sqrt(inside);
        }
      },
      {
        name:"Recta de Langer", color:seriesMeta[4][1], xmax:xSy,
        fn:x => p.sy/p.nd - x
      },
      {
        name:"Línea de carga", color:seriesMeta[5][1], xmax:xmax,
        dash:true,
        fn:x => Math.abs(p.sm) < 1e-12 ? NaN : (p.sa/p.sm)*x
      }
    ];

    // Determine y-range by evaluating the equations only for scaling.
    const yvals = [0];
    functions.forEach(s => {
      const steps = 250;
      for(let i=0;i<=steps;i++){
        const x = s.xmax * i/steps;
        const y = s.fn(x);
        if(Number.isFinite(y)) yvals.push(y);
      }
    });

    let ymin = Math.min(0, ...yvals);
    let ymax = Math.max(0, ...yvals);
    if(ymax === ymin) ymax = ymin + 1;
    const pad = (ymax-ymin)*0.08;
    ymax += pad;
    if(ymin < 0) ymin -= pad;

    const X = x => L + (x/xmax)*plotW;
    const Y = y => T + (ymax-y)/(ymax-ymin)*plotH;

    const parts = [];
    parts.push(`<rect x="${L}" y="${T}" width="${plotW}" height="${plotH}" fill="#fff" stroke="#dbe3ed"/>`);

    for(let i=0;i<=6;i++){
      const xv = xmax*i/6;
      const xx=X(xv);
      parts.push(`<line x1="${xx}" y1="${T}" x2="${xx}" y2="${H-B}" stroke="#eef2f7"/>`);
      parts.push(`<text x="${xx}" y="${H-B+24}" text-anchor="middle" font-size="12" fill="#64748b">${xv.toFixed(1)}</text>`);
    }

    for(let i=0;i<=6;i++){
      const yv=ymin+(ymax-ymin)*(i/6);
      const yy=Y(yv);
      parts.push(`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#eef2f7"/>`);
      parts.push(`<text x="${L-10}" y="${yy+4}" text-anchor="end" font-size="12" fill="#64748b">${yv.toFixed(1)}</text>`);
    }

    parts.push(`<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#64748b"/>`);
    parts.push(`<line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="#64748b"/>`);
    parts.push(`<text x="${L+plotW/2}" y="${H-14}" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">σm (MPa)</text>`);
    parts.push(`<text x="18" y="${T+plotH/2}" text-anchor="middle" font-size="14" font-weight="600" fill="#334155" transform="rotate(-90 18 ${T+plotH/2})">σa (MPa)</text>`);

    functions.forEach(s => {
      let d="";
      let started=false;
      const steps=600;
      for(let i=0;i<=steps;i++){
        const x=s.xmax*i/steps;
        const y=s.fn(x);
        if(!Number.isFinite(y)){
          started=false;
          continue;
        }
        d += `${started ? " L" : " M"} ${X(x).toFixed(2)} ${Y(y).toFixed(2)}`;
        started=true;
      }
      if(d){
        parts.push(`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.dash?2.4:2.2}" ${s.dash?'stroke-dasharray="7 5"':''} stroke-linecap="round" stroke-linejoin="round"/>`);
      }
    });

    // Current operating point.
    if(Number.isFinite(p.sm) && Number.isFinite(p.sa) && p.sm >= 0 && p.sm <= xmax){
      parts.push(`<circle cx="${X(p.sm)}" cy="${Y(p.sa)}" r="5" fill="#111827" stroke="#fff" stroke-width="2"/>`);
      parts.push(`<text x="${X(p.sm)+9}" y="${Y(p.sa)-9}" font-size="12" font-weight="700" fill="#111827">(${p.sm.toFixed(1)}, ${p.sa.toFixed(1)})</text>`);
    }

    svg.innerHTML=parts.join("");
    $("legend").innerHTML=seriesMeta.map((m,i) =>
      `<span><i class="dot" style="background:${m[1]};${i===5?'background:repeating-linear-gradient(90deg,'+m[1]+' 0 7px,transparent 7px 11px)':''}"></i>${m[0]}</span>`
    ).join("");
  }

  $("calc").addEventListener("click", calculate);
  $("reset").addEventListener("click", () => {
    $("smax").value=80;
    $("smin").value=20;
    $("sy").value=200;
    $("su").value=300;
    $("nd").value=2;
    calculate();
  });
  ids.forEach(id => $(id).addEventListener("keydown", e => {
    if(e.key==="Enter") calculate();
  }));

  calculate();
})();
</script>
</body>
</html>
